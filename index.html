<script>
const data=[{"topic": "संख्या पद्धति", "q": "3⁴¹ × 7⁸² × 8¹⁰³ के गुणनफल का इकाई अंक क्या है?", "options": ["2", "4", "6", "8"], "answer": "4", "concept": "इकाई अंक के चक्र देखें। 3⁴¹ → 3, 7⁸² → 9, 8¹⁰³ → 2। इसलिए 3×9×2=54, इकाई अंक 4।"}, {"topic": "शेषफल", "q": "x⁵¹ + 51 को x + 1 से विभाजित करने पर शेषफल क्या होगा?", "options": ["48", "49", "50", "52"], "answer": "50", "concept": "Remainder Theorem में x+1=0 ⇒ x=−1। अतः (−1)⁵¹+51=−1+51=50।"}, {"topic": "बीजगणित", "q": "यदि x²−px+q=0 के मूल लगातार दो पूर्णांक हैं, तो p²−4q का मान क्या होगा?", "options": ["0", "1", "2", "4"], "answer": "1", "concept": "मूल n और n+1 मानें। p=2n+1 तथा q=n(n+1)। इसलिए p²−4q=1।"}, {"topic": "फैक्टोरियल", "q": "100! के अंत में कुल कितने शून्य होंगे?", "options": ["20", "22", "24", "25"], "answer": "24", "concept": "Trailing zero = 5 के गुणकों की संख्या: ⌊100/5⌋+⌊100/25⌋=20+4=24।"}, {"topic": "गुणनखंड", "q": "360 के सभी धनात्मक गुणनखंडों का योग कितना है?", "options": ["1080", "1170", "1260", "1320"], "answer": "1170", "concept": "360=2³×3²×5। योग=(1+2+4+8)(1+3+9)(1+5)=15×13×6=1170।"}, {"topic": "A.P.", "q": "एक AP का pवाँ पद q और qवाँ पद p है। उसका (p+q)वाँ पद क्या होगा?", "options": ["−1", "0", "1", "p+q"], "answer": "0", "concept": "दोनों पदों के समीकरण घटाने पर d=−1 मिलता है। फिर a=p+q−1 और T(p+q)=0।"}, {"topic": "बीजीय सर्वसमिका", "q": "यदि x+1/x=5, तो x²+1/x² का मान क्या होगा?", "options": ["21", "23", "25", "27"], "answer": "23", "concept": "(x+1/x)²=x²+2+1/x²। इसलिए 25=x²+1/x²+2 ⇒ उत्तर 23।"}, {"topic": "घातांक", "q": "यदि 4ˣ=8, तो x का मान क्या है?", "options": ["1", "3/2", "2", "5/2"], "answer": "3/2", "concept": "4ˣ=2²ˣ और 8=2³। इसलिए 2x=3 ⇒ x=3/2।"}, {"topic": "रेखीय समीकरण", "q": "2x+3y=7 और 4x+6y=k के अनंत हल होने के लिए k का मान क्या होगा?", "options": ["7", "12", "14", "21"], "answer": "14", "concept": "दूसरी रेखा पहली का 2 गुना होनी चाहिए। 2(2x+3y=7) ⇒ 4x+6y=14।"}, {"topic": "निर्देशांक ज्यामिति", "q": "रेखा 2x−3y=11, रेखा 3x+ky=−4 पर लंब है। k का मान क्या है?", "options": ["−2", "2", "3", "−3"], "answer": "2", "concept": "पहली slope=2/3 और दूसरी slope=−3/k। लंब रेखाओं के लिए गुणनफल −1 ⇒ k=2।"}, {"topic": "समानांतर रेखाएँ", "q": "3x−y+5=0 और kx−2y+7=0 समानांतर हैं। k का मान क्या होगा?", "options": ["3", "4", "6", "8"], "answer": "6", "concept": "पहली slope=3, दूसरी slope=k/2। समानांतर होने पर k/2=3 ⇒ k=6।"}, {"topic": "परावर्तन", "q": "बिंदु (4,−3) का रेखा y=2 में प्रतिबिंब क्या होगा?", "options": ["(4,7)", "(−4,7)", "(4,−7)", "(−4,−7)"], "answer": "(4,7)", "concept": "y=2 से बिंदु की दूरी 5 है। प्रतिबिंब दूसरी ओर 5 इकाई होगा: y=7; x वही 4।"}, {"topic": "परावर्तन", "q": "बिंदु (−3,1) का रेखा x=−2 में प्रतिबिंब क्या होगा?", "options": ["(−1,1)", "(1,1)", "(−3,−1)", "(−2,1)"], "answer": "(−1,1)", "concept": "x=−2 से बिंदु 1 इकाई बाएँ है। प्रतिबिंब 1 इकाई दाएँ ⇒ x=−1।"}, {"topic": "दूरी सूत्र", "q": "मूल बिंदु से 4x+3y−12=0 की लंबवत दूरी कितनी है?", "options": ["12/5", "5/12", "3", "4"], "answer": "12/5", "concept": "दूरी=|4×0+3×0−12|/√(4²+3²)=12/5।"}, {"topic": "वृत्त", "q": "x²+y²−4x+6y−12=0 का केंद्र और त्रिज्या क्या है?", "options": ["(2,−3), 5", "(−2,3), 5", "(2,3), 4", "(−2,−3), 5"], "answer": "(2,−3), 5", "concept": "पूर्ण वर्ग: (x−2)²+(y+3)²=25। इसलिए केंद्र (2,−3), त्रिज्या 5।"}, {"topic": "जीवा", "q": "10 cm त्रिज्या के वृत्त में 12 cm और 16 cm की समानांतर जीवाएँ केंद्र के एक ही ओर हैं। उनके बीच दूरी कितनी है?", "options": ["1 cm", "2 cm", "3 cm", "4 cm"], "answer": "2 cm", "concept": "केंद्र से 12 cm जीवा की दूरी √(100−36)=8 और 16 cm जीवा की दूरी √(100−64)=6। अंतर 2 cm।"}, {"topic": "त्रिभुज", "q": "6 cm, 8 cm और 10 cm भुजाओं वाले समकोण त्रिभुज की अंतःवृत्त त्रिज्या कितनी है?", "options": ["1 cm", "2 cm", "3 cm", "4 cm"], "answer": "2 cm", "concept": "समकोण त्रिभुज में r=(a+b−c)/2=(6+8−10)/2=2 cm।"}, {"topic": "चक्रीय चतुर्भुज", "q": "चक्रीय चतुर्भुज का एक कोण 68° है। उसके विपरीत कोण का माप क्या होगा?", "options": ["102°", "112°", "118°", "122°"], "answer": "112°", "concept": "चक्रीय चतुर्भुज में विपरीत कोणों का योग 180° होता है। 180−68=112°।"}, {"topic": "समरूप त्रिभुज", "q": "दो समरूप त्रिभुजों के क्षेत्रफल 36 cm² और 100 cm² हैं। संगत भुजाओं का अनुपात क्या होगा?", "options": ["3:5", "6:10", "9:25", "18:50"], "answer": "3:5", "concept": "क्षेत्रफल अनुपात = भुजाओं के अनुपात का वर्ग। √(36/100)=3/5।"}, {"topic": "समद्विबाहु त्रिभुज", "q": "10 cm, 10 cm और 12 cm भुजाओं वाले समद्विबाहु त्रिभुज का क्षेत्रफल कितना है?", "options": ["36 cm²", "40 cm²", "48 cm²", "60 cm²"], "answer": "48 cm²", "concept": "ऊँचाई आधार को 6-6 में बाँटती है। h=√(100−36)=8। क्षेत्रफल=½×12×8=48।"}, {"topic": "गोला", "q": "गोले की त्रिज्या 50% बढ़ाने पर उसके पृष्ठीय क्षेत्रफल में कितने प्रतिशत की वृद्धि होगी?", "options": ["50%", "100%", "125%", "150%"], "answer": "125%", "concept": "क्षेत्रफल r² के समानुपाती है। नई त्रिज्या 1.5r ⇒ क्षेत्रफल 2.25 गुना। वृद्धि 125%।"}, {"topic": "गोला", "q": "9 cm त्रिज्या के धातु के गोले को पिघलाकर 3 cm त्रिज्या की कितनी गोलियाँ बनाई जा सकती हैं?", "options": ["9", "18", "27", "81"], "answer": "27", "concept": "आयतन r³ के समानुपाती है। संख्या=(9/3)³=27।"}, {"topic": "चार दीवारें", "q": "5 m × 4 m × 3 m कमरे की चार दीवारों पर ₹8 प्रति m² की दर से सफेदी का खर्च कितना होगा?", "options": ["₹432", "₹480", "₹528", "₹560"], "answer": "₹432", "concept": "चार दीवारों का क्षेत्रफल=2h(l+b)=2×3×9=54 m²। खर्च=54×8=₹432।"}, {"topic": "वृत्ताकार पथ", "q": "42 m त्रिज्या वाले पार्क के बाहर 7 m चौड़ा रास्ता है। π=22/7 पर रास्ते का क्षेत्रफल कितना होगा?", "options": ["1001 m²", "1540 m²", "2002 m²", "2156 m²"], "answer": "2002 m²", "concept": "बाहरी त्रिज्या 49 m। क्षेत्रफल=π(49²−42²)=22/7×637=2002 m²।"}, {"topic": "घन", "q": "घन का मुख्य विकर्ण 6√3 cm है। उसका कुल पृष्ठीय क्षेत्रफल कितना होगा?", "options": ["108 cm²", "180 cm²", "216 cm²", "324 cm²"], "answer": "216 cm²", "concept": "मुख्य विकर्ण=a√3 ⇒ a=6। TSA=6a²=216 cm²।"}, {"topic": "त्रिकोणमिति", "q": "यदि tanθ=3/4 और θ तीक्ष्ण कोण है, तो sinθ+cosθ का मान क्या है?", "options": ["1", "5/4", "7/5", "3/2"], "answer": "7/5", "concept": "3-4-5 त्रिभुज से sinθ=3/5 और cosθ=4/5। योग=7/5।"}, {"topic": "अधिकतम मान", "q": "2sinx+3cosx का अधिकतम मान क्या है?", "options": ["3", "5", "√13", "13"], "answer": "√13", "concept": "a sinx+b cosx का अधिकतम मान √(a²+b²) होता है। इसलिए √13।"}, {"topic": "ऊँचाई-दूरी", "q": "मीनार से 9 m और 16 m दूर दो बिंदुओं से उन्नयन कोण पूरक हैं। मीनार की ऊँचाई कितनी है?", "options": ["10 m", "12 m", "14 m", "16 m"], "answer": "12 m", "concept": "tanα=h/9 और tan(90−α)=h/16। इनके गुणनफल 1 होने से h²=9×16 ⇒ h=12 m।"}, {"topic": "चक्रवृद्धि ब्याज", "q": "कोई राशि 2 वर्षों में 4 गुनी होती है। उसी दर पर 6 वर्षों में कितनी गुनी होगी?", "options": ["16", "32", "64", "128"], "answer": "64", "concept": "हर 2 वर्ष में राशि 4 गुनी। 6 वर्ष=3 ऐसे काल ⇒ 4³=64 गुनी।"}, {"topic": "क्रमिक छूट", "q": "20%, 10% और 5% की क्रमिक छूट के बराबर एकल छूट कितनी होगी?", "options": ["30%", "31.6%", "32%", "35%"], "answer": "31.6%", "concept": "शेष factor=0.8×0.9×0.95=0.684। एकल छूट=1−0.684=31.6%।"}, {"topic": "लाभ-हानि", "q": "दुकानदार 1 kg के मूल्य पर 800 g देता है और क्रय मूल्य पर बेचने का दावा करता है। वास्तविक लाभ प्रतिशत कितना है?", "options": ["20%", "25%", "30%", "40%"], "answer": "25%", "concept": "800 g की लागत को 100 मानें तो 1 kg के नाम पर 125 मिलता है। लाभ=25%।"}, {"topic": "समय-कार्य", "q": "A कोई काम 12 दिन और B 18 दिन में करता है। दोनों मिलकर काम कितने दिन में करेंगे?", "options": ["6 दिन", "36/5 दिन", "8 दिन", "9 दिन"], "answer": "36/5 दिन", "concept": "संयुक्त दर=1/12+1/18=5/36। समय=36/5=7.2 दिन।"}, {"topic": "नल-टंकी", "q": "A पाइप 6 घंटे, B 8 घंटे में टंकी भरते हैं और C 12 घंटे में खाली करता है। तीनों साथ हों तो टंकी कितने समय में भरेगी?", "options": ["24/5 घंटे", "5 घंटे", "6 घंटे", "8 घंटे"], "answer": "24/5 घंटे", "concept": "नेट दर=1/6+1/8−1/12=5/24। समय=24/5 घंटे=4 घंटे 48 मिनट।"}, {"topic": "समय-दूरी", "q": "सामान्य गति के 3/4 से चलने पर व्यक्ति 20 मिनट देर से पहुँचता है। सामान्य यात्रा समय कितना था?", "options": ["40 मिनट", "50 मिनट", "60 मिनट", "80 मिनट"], "answer": "60 मिनट", "concept": "गति 3/4 होने पर समय 4/3 हो जाता है। अतिरिक्त समय=T/3=20 ⇒ T=60 मिनट।"}, {"topic": "सांख्यिकी", "q": "Mean और Mode का अंतर 12 है। अनुभवजन्य संबंध से Mean और Median का अंतर कितना होगा?", "options": ["3", "4", "6", "8"], "answer": "4", "concept": "Mode=3Median−2Mean। इसलिए Mean−Mode=3(Mean−Median)। 12/3=4।"}, {"topic": "औसत", "q": "प्रथम n प्राकृतिक संख्याओं का औसत 25 है। n का मान क्या होगा?", "options": ["25", "48", "49", "50"], "answer": "49", "concept": "पहली n प्राकृतिक संख्याओं का औसत=(n+1)/2। इसलिए n=49।"}, {"topic": "प्रायिकता", "q": "एक गैर-लीप वर्ष में 53 रविवार होने की प्रायिकता क्या है?", "options": ["1/7", "2/7", "1/52", "1/365"], "answer": "1/7", "concept": "365=52 सप्ताह+1 दिन। 53 रविवार तभी होंगे जब अतिरिक्त दिन रविवार हो। प्रायिकता 1/7।"}, {"topic": "पासा", "q": "दो पासे फेंके जाते हैं। योग अभाज्य संख्या होने की प्रायिकता क्या है?", "options": ["1/3", "5/12", "1/2", "7/18"], "answer": "5/12", "concept": "अभाज्य योग 2,3,5,7,11 के अनुकूल परिणाम 1+2+4+6+2=15। कुल 36। अतः 15/36=5/12।"}, {"topic": "मिश्रण", "q": "20% और 50% अल्कोहल घोल किस अनुपात में मिलाएँ कि 30% घोल बने?", "options": ["1:1", "2:1", "1:2", "3:2"], "answer": "2:1", "concept": "Alligation: 20% घोल के भाग=50−30=20 और 50% घोल के भाग=30−20=10। अनुपात 2:1।"}, {"topic": "समुच्चय", "q": "80 लोगों में 60 कॉफी और 50 चाय पसंद करते हैं। हर व्यक्ति कम-से-कम एक पसंद करता है। दोनों पसंद करने वाले कितने हैं?", "options": ["20", "25", "30", "35"], "answer": "30", "concept": "Inclusion-exclusion: दोनों=60+50−80=30।"}, {"topic": "प्रतिशत", "q": "किसी राशि में 25% वृद्धि और फिर 20% कमी की जाए, तो कुल परिवर्तन क्या होगा?", "options": ["5% वृद्धि", "5% कमी", "कोई परिवर्तन नहीं", "10% कमी"], "answer": "कोई परिवर्तन नहीं", "concept": "नई राशि=1.25×0.80=1.00 गुना। इसलिए कोई परिवर्तन नहीं।"}, {"topic": "अनुपात", "q": "a:b=3:5 और b:c=10:7 हो, तो a:c क्या होगा?", "options": ["3:7", "6:7", "7:6", "5:7"], "answer": "6:7", "concept": "3:5 को 2 से गुणा करें ⇒ a:b=6:10। इसलिए a:b:c=6:10:7 और a:c=6:7।"}, {"topic": "बीजगणित", "q": "यदि a+b=10 और ab=21, तो a²+b² का मान क्या है?", "options": ["42", "58", "79", "100"], "answer": "58", "concept": "a²+b²=(a+b)²−2ab=100−42=58।"}, {"topic": "बीजगणित", "q": "यदि x−y=4 और xy=5, तो x²+y² का मान क्या होगा?", "options": ["16", "20", "26", "36"], "answer": "26", "concept": "(x−y)²=x²+y²−2xy। 16=x²+y²−10 ⇒ उत्तर 26।"}, {"topic": "मॉड्यूलर अंकगणित", "q": "2¹⁰ को 7 से भाग देने पर शेषफल क्या होगा?", "options": ["1", "2", "3", "4"], "answer": "2", "concept": "2³≡1 (mod 7)। इसलिए 2¹⁰=(2³)³×2≡2।"}, {"topic": "सरेखीय बिंदु", "q": "(0,0), (1,2) और (a,b) सरेखीय हैं। a और b में क्या संबंध होगा?", "options": ["a=2b", "b=2a", "a+b=2", "ab=2"], "answer": "b=2a", "concept": "(0,0) और (1,2) की slope=2। इसलिए तीसरे बिंदु के लिए b/a=2 ⇒ b=2a।"}, {"topic": "वर्ग", "q": "144 cm² क्षेत्रफल वाले वर्ग के बाहर 2 cm चौड़ा रास्ता बनाया गया। रास्ते का क्षेत्रफल कितना होगा?", "options": ["80 cm²", "96 cm²", "112 cm²", "128 cm²"], "answer": "112 cm²", "concept": "वर्ग की भुजा 12 cm और बाहरी भुजा 16 cm। रास्ते का क्षेत्रफल=16²−12²=112 cm²।"}, {"topic": "ज्यामिति", "q": "त्रिभुज के कोण 2:3:4 के अनुपात में हैं। सबसे बड़ा कोण कितना है?", "options": ["60°", "70°", "80°", "90°"], "answer": "80°", "concept": "कुल 9 भाग=180°, एक भाग=20°। सबसे बड़ा कोण=4×20=80°।"}, {"topic": "वृत्त", "q": "7 cm त्रिज्या वाले वृत्त का क्षेत्रफल (π=22/7) कितना है?", "options": ["44 cm²", "77 cm²", "154 cm²", "308 cm²"], "answer": "154 cm²", "concept": "क्षेत्रफल=πr²=22/7×49=154 cm²।"}, {"topic": "औसत", "q": "5 संख्याओं का औसत 24 है। 18 हटाने पर शेष 4 संख्याओं का औसत क्या होगा?", "options": ["24", "25", "25.5", "26"], "answer": "25.5", "concept": "कुल योग=5×24=120। 18 हटाने पर 102। नया औसत=102/4=25.5।"}, {"topic": "प्रतिशत", "q": "₹800 की वस्तु पर 15% छूट देने के बाद विक्रय मूल्य कितना होगा?", "options": ["₹660", "₹680", "₹700", "₹720"], "answer": "₹680", "concept": "छूट=15%×800=₹120। विक्रय मूल्य=800−120=₹680।"}, {"topic": "घातांक", "q": "यदि 2ˣ=8 और 3ʸ=27, तो x+y का मान क्या होगा?", "options": ["4", "5", "6", "7"], "answer": "6", "concept": "2³=8 ⇒ x=3 और 3³=27 ⇒ y=3। इसलिए x+y=6।"}, {"topic": "क्षेत्रफल", "q": "शीर्ष (0,0), (4,0), (0,6) से बने त्रिभुज का क्षेत्रफल कितना है?", "options": ["10", "12", "16", "24"], "answer": "12", "concept": "यह समकोण त्रिभुज है। क्षेत्रफल=½×4×6=12 वर्ग इकाई।"}];let i=0,points=0,answered=Array(data.length).fill(false);
function render(){let d=data[i];document.getElementById('count').textContent='प्रश्न '+(i+1)+' / '+data.length;document.getElementById('score').textContent='Score: '+points;document.getElementById('bar').style.width=((i+1)/data.length*100)+'%';document.getElementById('topic').textContent=d.topic;document.getElementById('q').textContent=d.q;document.getElementById('opts').innerHTML='';document.getElementById('feedback').textContent='';document.getElementById('concept').style.display='none';
d.options.forEach((x,n)=>{let b=document.createElement('button');b.className='opt';b.textContent=String.fromCharCode(65+n)+'. '+x;b.onclick=()=>pick(n,b);document.getElementById('opts').appendChild(b)});document.getElementById('prev').disabled=i===0;document.getElementById('next').textContent=i===data.length-1?'परिणाम देखें →':'अगला →'}
function pick(n,b){if(answered[i])return;answered[i]=true;let d=data[i],ok=d.options[n]===d.answer;if(ok){points++;b.classList.add('correct');document.getElementById('feedback').innerHTML='✅ <b>Well Done!</b> सही उत्तर: '+d.answer}else{b.classList.add('wrong');document.getElementById('feedback').innerHTML='❌ Wrong Answer &nbsp; | &nbsp; 🟢 सही उत्तर: <b>'+d.answer+'</b>';[...document.querySelectorAll('.opt')].forEach((e,k)=>{if(d.options[k]===d.answer)e.classList.add('correct')})}document.getElementById('concept').innerHTML='<b>💡 Concept / Step:</b><br>'+d.concept;document.getElementById('concept').style.display='block';document.getElementById('score').textContent='Score: '+points}
document.getElementById('next').onclick=()=>{if(i<data.length-1){i++;render()}else{document.getElementById('result').style.display='block';document.getElementById('result').innerHTML='🎯 Final Score: <b>'+points+' / '+data.length+'</b><br><small>हर प्रश्न का Concept पढ़कर पुनः अभ्यास करें।</small>'}};
document.getElementById('prev').onclick=()=>{if(i>0){i--;render()}};render();
</script></body></html>
