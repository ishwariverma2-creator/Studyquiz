 x=3y। 27ᶻ=3³ᶻ इसलिए y=3z। अतः x=9z।"}, {"topic": "निर्देशांक ज्यामिति", "q": "रेखाएँ 2x−3y=11 और 3x+ky=−4 परस्पर लंब हैं। k=?", "options": ["−2", "2", "3", "−3"], "answer": "2", "concept": "पहली slope 2/3, दूसरी −3/k। लंब रेखाओं में m₁m₂=−1 ⇒ −2/k=−1 ⇒ k=2।"}, {"topic": "रेखाएँ", "q": "3x−y+5=0 और kx−2y+7=0 समानांतर हैं। k=?", "options": ["3", "4", "6", "8"], "answer": "6", "concept": "पहली slope=3 और दूसरी=k/2। समानांतर होने के लिए k/2=3, इसलिए k=6।"}, {"topic": "परावर्तन", "q": "बिंदु (4,−3) का रेखा y=2 में प्रतिबिंब?", "options": ["(4,7)", "(−4,7)", "(4,−7)", "(−4,−3)"], "answer": "(4,7)", "concept": "Horizontal mirror y=2 में x वही रहता है। y'=2×2−(−3)=7।"}, {"topic": "परावर्तन", "q": "बिंदु (−3,1) का रेखा x=−2 में प्रतिबिंब?", "options": ["(−1,1)", "(1,1)", "(−3,−1)", "(−2,1)"], "answer": "(−1,1)", "concept": "Vertical mirror x=−2 में x'=2(−2)−(−3)=−1 और y अपरिवर्तित।"}, {"topic": "वृत्त", "q": "x²+y²−4x+6y−12=0 का केंद्र व त्रिज्या?", "options": ["(2,−3),5", "(−2,3),5", "(2,3),4", "(−2,−3),4"], "answer": "(2,−3),5", "concept": "Complete square: (x−2)²+(y+3)²=25। केंद्र (2,−3), r=5।"}, {"topic": "वृत्त की जीवा", "q": "10 cm त्रिज्या वाले वृत्त में 12 cm और 16 cm की समानांतर जीवाएँ केंद्र के एक ही ओर हैं। दूरी?", "options": ["1 cm", "2 cm", "3 cm", "4 cm"], "answer": "2 cm", "concept": "केंद्र से दूरी √(10²−6²)=8 और √(10²−8²)=6। अंतर 2 cm।"}, {"topic": "त्रिभुज", "q": "6, 8, 10 cm समकोण त्रिभुज की अंतःवृत्त त्रिज्या?", "options": ["1", "2", "3", "4"], "answer": "2", "concept": "Right triangle में r=(a+b−c)/2=(6+8−10)/2=2।"}, {"topic": "चक्रीय चतुर्भुज", "q": "चक्रीय चतुर्भुज का एक कोण 68° है। विपरीत कोण?", "options": ["102°", "112°", "118°", "122°"], "answer": "112°", "concept": "Cyclic quadrilateral के opposite angles supplementary होते हैं: 180−68=112°।"}, {"topic": "समरूपता", "q": "दो समरूप त्रिभुजों के क्षेत्रफल 49:81 हैं। संगत भुजाओं का अनुपात?", "options": ["7:9", "49:81", "9:7", "14:18"], "answer": "7:9", "concept": "समरूप आकृतियों में area ratio = side ratio का square। √49:√81=7:9।"}, {"topic": "अंतःकेंद्र", "q": "त्रिभुज ABC के अंतःकेंद्र I के लिए ∠BIC=125° है। ∠A=?", "options": ["60°", "70°", "75°", "80°"], "answer": "70°", "concept": "Incenter theorem: ∠BIC=90°+A/2। 125=90+A/2 ⇒ A=70°।"}, {"topic": "त्रिकोणमिति", "q": "tanθ=3/4, θ तीक्ष्ण है। sinθ+cosθ=?", "options": ["1", "7/5", "5/7", "3/4"], "answer": "7/5", "concept": "3-4-5 triangle: sin=3/5, cos=4/5; योग 7/5।"}, {"topic": "त्रिकोणमिति", "q": "2sinx+3cosx का अधिकतम मान?", "options": ["3", "5", "√13", "13"], "answer": "√13", "concept": "a sinx+b cosx का maximum √(a²+b²) होता है। यहाँ √(4+9)=√13।"}, {"topic": "ऊँचाई-दूरी", "q": "एक मीनार से 9 m और 16 m दूर दो बिंदुओं से उन्नयन कोण पूरक हैं। मीनार की ऊँचाई?", "options": ["10 m", "12 m", "14 m", "15 m"], "answer": "12 m", "concept": "यदि angles α और 90−α हैं, तो tanα·cotα=1। h/9 × h/16=1 ⇒ h²=144 ⇒ h=12।"}, {"topic": "क्षेत्रमिति", "q": "गोले की त्रिज्या 50% बढ़ती है। Surface area में वृद्धि?", "options": ["100%", "115%", "125%", "150%"], "answer": "125%", "concept": "Surface area ∝r²। नया factor=(1.5)²=2.25। वृद्धि=1.25=125%।"}, {"topic": "गोला", "q": "9 cm त्रिज्या के गोले को पिघलाकर 3 cm त्रिज्या की गोलियाँ बनती हैं। संख्या?", "options": ["9", "18", "27", "81"], "answer": "27", "concept": "Volume ∝r³। संख्या=(9/3)³=27।"}, {"topic": "घन", "q": "घन का मुख्य विकर्ण 6√3 cm है। Total surface area?", "options": ["108", "144", "216", "324"], "answer": "216", "concept": "a√3=6√3 ⇒ a=6। TSA=6a²=6×36=216 cm²।"}, {"topic": "वृत्ताकार पथ", "q": "42 m त्रिज्या पार्क के बाहर 7 m चौड़ा पथ है। π=22/7, क्षेत्रफल?", "options": ["1001", "1540", "2002", "2156"], "answer": "2002", "concept": "Outer radius=49। Path area=π(49²−42²)=22/7×637=2002? ध्यान: 637×22/7=91×22=2002।"}, {"topic": "प्रतिशत", "q": "किसी संख्या में 20% वृद्धि और फिर 20% कमी हो तो कुल परिवर्तन?", "options": ["कोई परिवर्तन नहीं", "4% कमी", "4% वृद्धि", "8% कमी"], "answer": "4% कमी", "concept": "100→120→96। अंतिम मान मूल से 4% कम।"}, {"topic": "क्रमिक छूट", "q": "20%, 10% और 5% क्रमिक छूट की एकल समतुल्य छूट?", "options": ["31.6%", "31.4%", "32%", "35%"], "answer": "31.6%", "concept": "शेष मूल्य factor=.80×.90×.95=.684। Discount=1−.684=.316=31.6%।"}, {"topic": "लाभ-हानि", "q": "दुकानदार CP पर बेचता है पर 1 kg की जगह 800 g देता है। लाभ प्रतिशत?", "options": ["20%", "25%", "30%", "40%"], "answer": "25%", "concept": "800g की लागत 0.8×CP है, पर वह 1kg का CP लेता है। लाभ=.2/.8×100=25%।"}, {"topic": "समय-कार्य", "q": "A 12 दिन और B 18 दिन में काम करते हैं। साथ काम करने पर समय?", "options": ["6 दिन", "7.2 दिन", "8 दिन", "9 दिन"], "answer": "7.2 दिन", "concept": "Combined rate=1/12+1/18=5/36। समय=36/5=7.2 दिन।"}, {"topic": "नल-टंकी", "q": "A 6 घंटे में भरता, B 8 घंटे में भरता, C 12 घंटे में खाली करता है। तीनों साथ?", "options": ["4 h 48 min", "5 h", "6 h", "8 h"], "answer": "4 h 48 min", "concept": "Net rate=1/6+1/8−1/12=5/24। समय=24/5=4.8 h=4 h 48 min।"}, {"topic": "गति-दूरी", "q": "सामान्य गति के 3/4 से चलने पर 20 मिनट देर होती है। सामान्य यात्रा समय?", "options": ["40", "50", "60", "80"], "answer": "60", "concept": "नई time =4/3 T। Delay=T/3=20 ⇒ T=60 min।"}, {"topic": "औसत", "q": "पहली n प्राकृतिक संख्याओं का औसत 25 है। n=?", "options": ["25", "49", "50", "51"], "answer": "49", "concept": "Average=(n+1)/2=25 ⇒ n+1=50 ⇒ n=49।"}, {"topic": "सांख्यिकी", "q": "Mean−Mode=12 है। Empirical relation से Mean−Median=?", "options": ["3", "4", "6", "8"], "answer": "4", "concept": "Mode=3Median−2Mean ⇒ Mean−Mode=3(Mean−Median)। अतः 12=3d ⇒ d=4।"}, {"topic": "प्रायिकता", "q": "गैर-लीप वर्ष में 53 रविवार होने की प्रायिकता?", "options": ["1/7", "2/7", "1/52", "0"], "answer": "1/7", "concept": "365=52 weeks+1 day। अतिरिक्त दिन रविवार होने पर 53 रविवार होंगे।"}, {"topic": "पासा", "q": "दो पासों का योग अभाज्य होने की प्रायिकता?", "options": ["1/3", "5/12", "7/18", "1/2"], "answer": "5/12", "concept": "Prime sums 2,3,5,7,11 के favourable outcomes 1+2+4+6+2=15। 15/36=5/12।"}, {"topic": "मिश्रण", "q": "20% और 50% घोल किस अनुपात में मिलें कि 30% घोल : ["50", "60", "65", "120"], "answer": "60", "concept": "ऊँचाई आधार को 5-5 में बाँटती है। h=√(13²−5²)=12। Area=1/2×10×12=60।"}, {"topic": "वृत्त", "q": "बाहरी बिंदु P से वृत्त पर tangent PT=12 cm और OP=13 cm है। त्रिज्या?", "options": ["4", "5", "6", "7"], "answer": "5", "concept": "Radius tangent पर perpendicular है। OP²=OT²+PT² ⇒ r²=169−144=25 ⇒ r=5।"}, {"topic": "निर्देशांक", "q": "(1,2), (3,6), (a,10) सरेखीय हैं। a=?", "options": ["4", "5", "6", "7"], "answer": "5", "concept": "पहले दो बिंदुओं की slope=(6−2)/(3−1)=2। इसलिए (10−6)/(a−3)=2 ⇒ 4=2a−6 ⇒ a=5।"}, {"topic": "कठिन बीजगणित", "q": "यदि x²−5x+1=0, तो x²+1/x² का मान?", "options": ["21", "23", "25", "27"], "answer": "23", "concept": "x²−5x+1=0 को x से भाग दें: x+1/x=5। फिर square करके x²+1/x²=25−2=23।"}];let i=0,score=0,done=Array(D.length).fill(false);
function show(){let d=D[i];count.textContent=`प्रश्न ${i+1} / ${D.length}`;bar.style.width=((i+1)/D.length*100)+'%';topic.textContent=d.topic;q.textContent=d.q;opts.innerHTML='';feedback.textContent='';concept.style.display='none';concept.innerHTML='<b>💡 Concept / हल:</b><br>'+d.concept;
