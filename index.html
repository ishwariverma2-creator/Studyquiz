<script>
const data = [{"topic": "संख्या पद्धति", "q": "यदि 3^41 × 7^82 × 8^103 का इकाई अंक ज्ञात करना हो, तो सही उत्तर क्या होगा?", "options": ["0", "2", "4", "8"], "answer": "2", "concept": "अंतिम अंक के चक्र को 4 के मॉड्यूलो में देखें। 3 और 7 के घातों के अंतिम अंकों के चक्र तथा 8^n का अंतिम अंक मिलाकर उत्तर मिलता है।"}, {"topic": "बीजगणित", "q": "यदि x² − px + q = 0 के मूल दो लगातार पूर्णांक हैं, तो p² − 4q का मान क्या होगा?", "options": ["0", "1", "2", "4"], "answer": "1", "concept": "मान लें मूल n और n+1 हैं। तब p=2n+1 तथा q=n(n+1)। अतः p²−4q=(2n+1)²−4n(n+1)=1।"}, {"topic": "संख्या पद्धति", "q": "100! के अंत में कितने शून्य होंगे?", "options": ["20", "22", "24", "25"], "answer": "24", "concept": "शून्यों की संख्या = floor(100/5)+floor(100/25)=20+4=24।"}, {"topic": "बीजगणित", "q": "एक AP में pवाँ पद q और qवाँ पद p है। (p+q)वाँ पद क्या होगा?", "options": ["p+q", "0", "−1", "1"], "answer": "0", "concept": "AP का a_n=a+(n−1)d लें। दोनों शर्तों को घटाने पर d(p−q)=−(p−q), इसलिए d=−1; फिर a+p−1=q से a=p+q−1। अतः a_(p+q)=0।"}, {"topic": "ज्यामिति", "q": "6 cm, 8 cm और 10 cm भुजाओं वाले समकोण त्रिभुज की अंतःवृत्त त्रिज्या कितनी है?", "options": ["1 cm", "2 cm", "3 cm", "4 cm"], "answer": "2 cm", "concept": "समकोण त्रिभुज में r=(a+b−c)/2=(6+8−10)/2=2 cm।"}, {"topic": "निर्देशांक ज्यामिति", "q": "बिंदु (4, −3) का रेखा y=2 में परावर्तन क्या होगा?", "options": ["(4,7)", "(−4,7)", "(4,−7)", "(−4,−7)"], "answer": "(4,7)", "concept": "y=2 से y=−3 की दूरी 5 है। प्रतिबिंब 5 इकाई ऊपर होगा: y=2+5=7; x अपरिवर्तित रहेगा।"}, {"topic": "निर्देशांक ज्यामिति", "q": "मूल बिंदु से 4x+3y−12=0 की लंबवत दूरी कितनी है?", "options": ["12/5", "3", "4", "5"], "answer": "12/5", "concept": "दूरी = |−12|/√(4²+3²)=12/5।"}, {"topic": "वृत्त", "q": "x²+y²−4x+6y−12=0 का केंद्र और त्रिज्या क्या है?", "options": ["(2,−3), 5", "(−2,3), 5", "(2,3), 4", "(−2,−3), 4"], "answer": "(2,−3), 5", "concept": "पूर्ण वर्ग: (x−2)²+(y+3)²=25। इसलिए केंद्र (2,−3), त्रिज्या 5।"}, {"topic": "क्षेत्रमिति", "q": "एक गोले की त्रिज्या 50% बढ़ाई जाए तो उसके पृष्ठीय क्षेत्रफल में कितनी प्रतिशत वृद्धि होगी?", "options": ["50%", "75%", "100%", "125%"], "answer": "125%", "concept": "पृष्ठीय क्षेत्रफल r² के समानुपाती है। नई त्रिज्या 1.5r है, इसलिए क्षेत्रफल 2.25 गुना; वृद्धि 125%।"}, {"topic": "क्षेत्रमिति", "q": "9 cm त्रिज्या के धातु के गोले को पिघलाकर 3 cm त्रिज्या की छोटी गोलियाँ बनाई जाएँ, तो कितनी गोलियाँ बनेंगी?", "options": ["9", "18", "27", "81"], "answer": "27", "concept": "गोलियों की संख्या = (9/3)^3=27।"}, {"topic": "क्षेत्रमिति", "q": "5 m × 4 m × 3 m कमरे की चार दीवारों पर ₹8 प्रति m² की दर से सफेदी का खर्च कितना होगा?", "options": ["₹432", "₹480", "₹528", "₹560"], "answer": "₹432", "concept": "चार दीवारों का क्षेत्रफल=2h(l+b)=2×3×9=54 m²। खर्च=54×8=₹432।"}, {"topic": "ज्यामिति", "q": "त्रिज्या 10 cm के वृत्त में केंद्र के एक ही ओर 12 cm और 16 cm की समानांतर जीवाएँ हैं। उनके बीच दूरी कितनी है?", "options": ["1 cm", "2 cm", "3 cm", "4 cm"], "answer": "2 cm", "concept": "केंद्र से 12 cm जीवा की दूरी √(100−36)=8; 16 cm जीवा की दूरी √(100−64)=6। अंतर=2 cm।"}, {"topic": "समरूप त्रिभुज", "q": "दो समरूप त्रिभुजों के क्षेत्रफल 25 cm² और 100 cm² हैं। संगत भुजाओं का अनुपात क्या होगा?", "options": ["1:2", "1:3", "1:4", "1:5"], "answer": "1:2", "concept": "क्षेत्रफल अनुपात 1:4 है, इसलिए भुजा अनुपात √1:√4=1:2।"}, {"topic": "त्रिकोणमिति", "q": "यदि tan θ = 3/4 और θ तीक्ष्ण कोण है, तो sin θ + cos θ का मान क्या होगा?", "options": ["7/5", "1", "5/7", "3/4"], "answer": "7/5", "concept": "3-4-5 त्रिभुज से sinθ=3/5, cosθ=4/5; योग=7/5।"}, {"topic": "त्रिकोणमिति", "q": "यदि sin θ=12/13 और θ तीक्ष्ण है, तो cos θ क्या होगा?", "options": ["5/13", "12/13", "13/5", "1/13"], "answer": "5/13", "concept": "cos²θ=1−sin²θ=1−144/169=25/169, अतः cosθ=5/13।"}, {"topic": "अधिकतम मान", "q": "2 sin x + 3 cos x का अधिकतम मान क्या है?", "options": ["3", "√13", "5", "13"], "answer": "√13", "concept": "a sinx+b cosx का अधिकतम मान √(a²+b²)=√13।"}, {"topic": "घन", "q": "यदि घन का मुख्य विकर्ण 6√3 cm है, तो उसका कुल पृष्ठीय क्षेत्रफल कितना है?", "options": ["36 cm²", "72 cm²", "216 cm²", "108 cm²"], "answer": "216 cm²", "concept": "मुख्य विकर्ण=a√3, अतः a=6। TSA=6a²=216 cm²।"}, {"topic": "वृत्ताकार पथ", "q": "42 m त्रिज्या वाले पार्क के बाहर 7 m चौड़ा रास्ता है। रास्ते का क्षेत्रफल (π=22/7) कितना होगा?", "options": ["980 m²", "1001 m²", "1078 m²", "1120 m²"], "answer": "1001 m²", "concept": "बाहरी त्रिज्या 49 m। क्षेत्रफल=22/7×(49²−42²)=1001 m²।"}, {"topic": "चक्रवृद्धि ब्याज", "q": "यदि कोई राशि 2 वर्षों में 4 गुनी हो जाती है, तो उसी दर पर 4 वर्षों में कितनी गुनी होगी?", "options": ["8", "12", "16", "20"], "answer": "16", "concept": "(1+r)^2=4, इसलिए (1+r)^4=16।"}, {"topic": "क्रमिक छूट", "q": "20% और 10% की क्रमिक छूट के बराबर एकल छूट कितनी होगी?", "options": ["28%", "30%", "32%", "18%"], "answer": "28%", "concept": "एकल छूट=1−(0.8×0.9)=0.28=28%।"}, {"topic": "लाभ-हानि", "q": "दुकानदार क्रय मूल्य पर बेचने का दावा करता है, लेकिन 1 kg के स्थान पर 800 g देता है। वास्तविक लाभ प्रतिशत कितना है?", "options": ["20%", "25%", "30%", "12.5%"], "answer": "25%", "concept": "₹1/kg मानें। ₹1 में 800g देकर 1000/800=1.25 गुना प्रभावी मूल्य; लाभ 25%।"}, {"topic": "समय और कार्य", "q": "A किसी काम को 12 दिन और B 18 दिन में करता है। दोनों साथ शुरू करते हैं; B काम पूरा होने से 3 दिन पहले छोड़ देता है। काम कितने दिनों में पूरा होगा?", "options": ["8 दिन", "8.4 दिन", "9 दिन", "10 दिन"], "answer": "8.4 दिन", "concept": "यदि कुल t दिन, तो t/12+(t−3)/18=1। 3t+2t−6=36 ⇒ 5t=42 ⇒ t=8.4 दिन।"}, {"topic": "नल-टंकी", "q": "एक पाइप 6 घंटे में भरता है और दूसरा 8 घंटे में; निकासी पाइप 12 घंटे में खाली करता है। तीनों साथ हों तो समय?", "options": ["24/5 घंटे", "5 घंटे", "6 घंटे", "8 घंटे"], "answer": "24/5 घंटे", "concept": "दर=1/6+1/8−1/12=5/24 टंकी/घंटा। समय=24/5 घंटे=4 घंटे 48 मिनट।"}, {"topic": "प्रायिकता", "q": "दो पासे फेंके जाएँ। योग अभाज्य संख्या होने की प्रायिकता क्या है?", "options": ["1/3", "5/12", "7/18", "1/2"], "answer": "5/12", "concept": "अभाज्य योग 2,3,5,7,11 के अनुकूल परिणाम 1+2+4+6+2=15; कुल 36। प्रायिकता=15/36=5/12।"}, {"topic": "समुच्चय", "q": "एक समूह में 60 लोग कॉफी, 50 लोग चाय पसंद करते हैं और 80 लोग कम-से-कम एक पसंद करते हैं। दोनों पसंद करने वालों की संख्या कितनी है?", "options": ["20", "25", "30", "35"], "answer": "30", "concept": "|C∩T|=|C|+|T|−|C∪T|=60+50−80=30।"}, {"topic": "सांख्यिकी", "q": "किसी वितरण में Mean और Mode का अंतर 12 है। अनुभवजन्य संबंध से Mean और Median का अंतर कितना होगा?", "options": ["4", "6", "8", "12"], "answer": "4", "concept": "Mode=3Median−2Mean। इसलिए Mean−Mode=3(Mean−Median); अतः अंतर 12 होने पर Mean−Median=4।"}, {"topic": "औसत", "q": "प्रथम n प्राकृतिक संख्याओं का औसत 25 है। n का मान क्या होगा?", "options": ["24", "25", "49", "50"], "answer": "49", "concept": "पहली n प्राकृतिक संख्याओं का औसत (n+1)/2=25; n=49।"}, {"topic": "परावर्तन", "q": "बिंदु (−3,1) का रेखा x=−2 में परावर्तन क्या होगा?", "options": ["(−1,1)", "(1,1)", "(−3,−1)", "(−2,1)"], "answer": "(−1,1)", "concept": "दर्पण x=−2 से बिंदु 1 इकाई बाएँ है; प्रतिबिंब 1 इकाई दाएँ: x=−1।"}, {"topic": "रेखाएँ", "q": "यदि 2x−3y=11 और 3x+ky=−4 परस्पर लंबवत हैं, तो k क्या होगा?", "options": ["−2", "2", "−3/2", "3/2"], "answer": "2", "concept": "पहली slope=2/3, दूसरी slope=−3/k। गुणनफल −1: (2/3)(−3/k)=−1 ⇒ k=2।"}, {"topic": "रेखाएँ", "q": "3x−y+5=0 और kx−2y+7=0 समानांतर हैं। k का मान?", "options": ["3", "6", "−6", "2"], "answer": "6", "concept": "पहली slope=3; दूसरी slope=k/2। समानांतर होने पर k/2=3 ⇒ k=6।"}, {"topic": "बीजगणित", "q": "यदि a+b=10 और ab=21, तो a²+b² का मान क्या है?", "options": ["42", "58", "79", "100"], "answer": "58", "concept": "a²+b²=(a+b)²−2ab=100−42=58।"}, {"topic": "बीजगणित", "q": "यदि x+1/x=5, तो x²+1/x² का मान क्या है?", "options": ["23", "25", "27", "21"], "answer": "23", "concept": "वर्ग करने पर x²+2+1/x²=25, इसलिए मान=23।"}, {"topic": "संख्या पद्धति", "q": "यदि n को 7 से भाग देने पर शेष 5 आता है, तो 3n+4 को 7 से भाग देने पर शेष क्या होगा?", "options": ["1", "2", "3", "5"], "answer": "5", "concept": "n≡5 (mod 7), इसलिए 3n+4≡15+4=19≡5।"}, {"topic": "प्रतिशत", "q": "किसी संख्या में पहले 20% वृद्धि और फिर 20% कमी की जाए, तो कुल परिवर्तन क्या होगा?", "options": ["0%", "4% कमी", "4% वृद्धि", "2% कमी"], "answer": "4% कमी", "concept": "नई संख्या=1.2×0.8=0.96; यानी 4% कमी।"}, {"topic": "अनुपात", "q": "यदि a:b=3:5 और b:c=10:7, तो a:c क्या होगा?", "options": ["3:7", "6:7", "7:6", "5:7"], "answer": "6:7", "concept": "पहले अनुपात को 2 से गुणा: a:b=6:10; इसलिए a:b:c=6:10:7।"}, {"topic": "क्षेत्रमिति", "q": "एक वर्ग का क्षेत्रफल 144 cm² है। उसके चारों ओर 2 cm चौड़ा रास्ता बाहर बनाया जाए, तो रास्ते का क्षेत्रफल कितना होगा?", "options": ["64 cm²", "80 cm²", "96 cm²", "112 cm²"], "answer": "112 cm²", "concept": "वर्ग की भुजा 12; बाहरी भुजा 16। रास्ता=16²−12²=112 cm²। दिए विकल्प में सही उत्तर 112 है, इसलिए उत्तर विकल्प सुधारा गया।"}, {"topic": "ज्यामिति", "q": "एक त्रिभुज के कोण 2:3:4 के अनुपात में हैं। सबसे बड़ा कोण कितना है?", "options": ["40°", "60°", "80°", "90°"], "answer": "80°", "concept": "कुल 9 भाग=180°, एक भाग=20°; सबसे बड़ा=4×20=80°।"}, {"topic": "ज्यामिति", "q": "एक चक्रीय चतुर्भुज में एक कोण 68° है। उसके विपरीत कोण का माप क्या होगा?", "options": ["68°", "102°", "112°", "122°"], "answer": "112°", "concept": "चक्रीय चतुर्भुज के विपरीत कोणों का योग 180° होता है। 180−68=112°।"}, {"topic": "समय-दूरी", "q": "एक व्यक्ति सामान्य गति के 3/4 से चलता है और 20 मिनट देर से पहुँचता है। सामान्य यात्रा समय कितना था?", "options": ["40 मिनट", "50 मिनट", "60 मिनट", "80 मिनट"], "answer": "60 मिनट", "concept": "समय का अनुपात 4:3 है। अतिरिक्त समय सामान्य समय का 1/3 है; 1/3 T=20 ⇒ T=60 मिनट।"}, {"topic": "मिश्रण", "q": "20% और 50% अल्कोहल वाले घोल को किस अनुपात में मिलाएँ कि 30% घोल मिले?", "options": ["1:1", "2:1", "1:2", "3:1"], "answer": "2:1", "concept": "एलिगेशन: 20% के भाग=50−30=20; 50% के भाग=30−20=10; अनुपात 20:10=2:1।"}, {"topic": "औसत", "q": "5 संख्याओं का औसत 24 है। यदि एक संख्या 18 हटाई जाए, तो शेष 4 संख्याओं का औसत क्या होगा?", "options": ["24", "25", "25.5", "26"], "answer": "25.5", "concept": "कुल=120। 18 हटाने पर 102; 102/4=25.5।"}, {"topic": "प्रायिकता", "q": "एक गैर-लीप वर्ष में 53 रविवार होने की प्रायिकता क्या है?", "options": ["0", "1/7", "2/7", "1/365"], "answer": "1/7", "concept": "365=52 सप्ताह+1 दिन। 53 रविवार तभी जब अतिरिक्त दिन रविवार हो; प्रायिकता 1/7।"}, {"topic": "संख्या पद्धति", "q": "किसी संख्या के 3/5 का मान 48 है। संख्या क्या है?", "options": ["60", "72", "80", "90"], "answer": "80", "concept": "संख्या=48×5/3=80।"}, {"topic": "बीजगणित", "q": "यदि x−y=4 और xy=5, तो x²+y² का मान क्या है?", "options": ["16", "20", "26", "36"], "answer": "26", "concept": "(x−y)²=x²+y²−2xy; 16=x²+y²−10, इसलिए 26।"}, {"topic": "ज्यामिति", "q": "एक समद्विबाहु त्रिभुज का आधार 12 cm और बराबर भुजाएँ 10 cm हैं। ऊँचाई कितनी होगी?", "options": ["6 cm", "8 cm", "10 cm", "12 cm"], "answer": "8 cm", "concept": "ऊँचाई आधार को 6 और 6 में बाँटती है। h=√(10²−6²)=8 cm।"}, {"topic": "वृत्त", "q": "एक वृत्त की त्रिज्या 7 cm है। उसका क्षेत्रफल (π=22/7) कितना होगा?", "options": ["44", "154", "308", "49"], "answer": "154", "concept": "क्षेत्रफल=πr²=22/7×49=154 cm²।"}, {"topic": "प्रतिशत", "q": "किसी वस्तु का मूल्य ₹800 है। 15% छूट के बाद विक्रय मूल्य क्या होगा?", "options": ["₹660", "₹680", "₹700", "₹720"], "answer": "₹680", "concept": "छूट=₹120; विक्रय मूल्य=800−120=₹680।"}, {"topic": "बीजगणित", "q": "यदि 2x+3=17, तो x²−x का मान क्या होगा?", "options": ["42", "49", "56", "64"], "answer": "42", "concept": "x=7; x²−x=49−7=42। दिए विकल्प में सही उत्तर 42 है। उत्तर विकल्पों में सुधार आवश्यक।"}, {"topic": "संख्या पद्धति", "q": "2^10 को 7 से भाग देने पर शेषफल क्या होगा?", "options": ["1", "2", "3", "4"], "answer": "2", "concept": "2^3≡1 (mod 7); 2^10=2^9×2≡1×2=2।"}, {"topic": "ज्यामिति", "q": "एक वृत्त की त्रिज्या दोगुनी कर दी जाए तो क्षेत्रफल कितने गुना होगा?", "options": ["2", "3", "4", "8"], "answer": "4", "concept": "क्षेत्रफल r² के समानुपाती है; (2r)²/r²=4।"}];
, answered=new Array(data.length).fill(false);
const q=document.getElementById('question'), opts=document.getElementById('options'), fb=document.getElementById('feedback'), con=document.getElementById('concept');
function render(){const d=data[i];document.getElementById('counter').textContent=`प्रश्न ${i+1} / ${data.length}`;
document.getElementById('bar').style.width=((i+1)/data.length*100)+'%';document.getElementById('topic').textContent=d.topic;q.textContent=d.q;opts.innerHTML='';
d.options.forEach((x,n)=>{let b=document.createElement('button');b.className='opt';b.textContent=String.fromCharCode(65+n)+'. '+x;b.onclick=()=>choose(n,b);opts.appendChild(b)});
fb.textContent='';con.style.display='none';con.textContent='💡 Concept: '+d.concept;
document.getElementById('prev').disabled=i===0;document.getElementById('next').textContent=i===data.length-1?'परिणाम देखें →':'अगला →';
if(answered[i]){fb.textContent='यह प्रश्न पहले उत्तर दिया जा चुका है।';}}
function choose(n,b){if(answered[i])return;answered[i]=true;const d=data[i];const ok=d.options[n]===d.answer;
if(ok){score++;b.classList.add('correct');fb.textContent='✅ Well Done! सही उत्तर';}else{b.classList.add('wrong');fb.textContent='❌ Wrong Answer';[...opts.children].forEach(x=>{if(x.textContent.slice(3)===d.answer)x.classList.add('correct')});}
con.style.display='block';}
document.getElementById('next').onclick=()=>{if(i<data.length-1){i++;render()}else{document.getElementById('score').style.display='block';document.getElementById('score').innerHTML=`🎯 आपका स्कोर: <b>${score} / ${data.length}</b><br><small>फिर से अभ्यास करने के लिए पेज refresh करें।</small>`}};
document.getElementById('prev').onclick=()=>{if(i>0){i--;render()}};render();
</script></body></html>
