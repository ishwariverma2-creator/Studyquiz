let current=TOPICS[0], score=0, answered=0;
const topicBox=document.getElementById('topics');

function buildTopics(){
 topicBox.innerHTML='';
 TOPICS.forEach((t,i)=>{
   const b=document.createElement('button');
   b.className='topic '+(t===current?'active':'');
   b.innerHTML='<span class="topicNo">'+(i+1)+'</span><span>'+t+'</span><small>50 प्रश्न</small>';
   b.onclick=()=>selectTopic(t);
   topicBox.appendChild(b);
 });
}
function selectTopic(t){
 current=t; score=0; answered=0;
 document.getElementById('topicTitle').textContent=t;
 document.getElementById('count').textContent=BANK[t].length;
 buildTopics(); render();
 window.scrollTo({top:document.querySelector('.panel').offsetTop-10,behavior:'smooth'});
}
function render(){
 const box=document.getElementById('quiz'); box.innerHTML='';
 BANK[current].forEach((q,i)=>{
   const card=document.createElement('article'); card.className='card';
   card.innerHTML='<div class="qhead"><span class="qnum">'+(i+1)+'</span><div class="q">'+q[0]+'</div></div>';
   const ops=document.createElement('div'); ops.className='options';
   q[1].forEach((op,j)=>{
      const btn=document.createElement('button'); btn.className='option'; btn.textContent=String.fromCharCode(65+j)+'. '+op;
      btn.onclick=()=>answer(i,j,ops,card);
      ops.appendChild(btn);
   });
   card.appendChild(ops); box.appendChild(card);
 });
 update();
}
function answer(i,j,ops,card){
 const buttons=[...ops.children]; buttons.forEach(x=>x.disabled=true);
 const correct=BANK[current][i][2];
 const ok=j===correct;
 buttons[correct].classList.add('correct');
 if(!ok) buttons[j].classList.add('wrong'); else score++;
 answered++;
 const fb=document.createElement('div'); fb.className=ok?'feedback good':'feedback bad';
 fb.innerHTML=ok?'✓ Well Done! सही उत्तर।':'✗ ध्यान दें! हरे रंग में सही उत्तर दिया गया है।';
 card.appendChild(fb);
 const c=document.createElement('div'); c.className='concept';
 c.innerHTML='<h3>📘 सरल Concept</h3><p>'+BANK[current][i][3]+'</p><p class="why"><b>समझने की बात:</b> इस Concept को पढ़कर यह याद रखें कि प्रश्न में दिए शब्दों को वास्तविक प्राकृतिक प्रक्रिया से जोड़कर समझना है।</p>';
 card.appendChild(c); update();
}
function update(){
 const total=BANK[current].length;
 document.getElementById('score').textContent=score;
 document.getElementById('pct').textContent=Math.round(answered/total*100)+'%';
 document.getElementById('bar').style.width=(answered/total*100)+'%';
}
